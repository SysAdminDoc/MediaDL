<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MediaDL Queue</title>
  <style>
    :root { color-scheme: dark; font-family: Segoe UI, system-ui, sans-serif; background: #111827; color: #f3f4f6; }
    body { margin: 0; padding: 14px; background: #111827; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    h1 { font-size: 17px; margin: 0; }
    button { border: 1px solid #374151; border-radius: 6px; color: #f9fafb; background: #1f2937; padding: 6px 9px; cursor: pointer; }
    button:hover { background: #374151; }
    #connection { color: #9ca3af; font-size: 11px; margin: 8px 0 12px; }
    #queue { display: grid; gap: 8px; list-style: none; padding: 0; margin: 0; }
    .item { border: 1px solid #374151; border-radius: 8px; padding: 9px; background: #182234; }
    .title { font-size: 12px; line-height: 1.35; overflow-wrap: anywhere; }
    .meta { color: #9ca3af; font-size: 10px; margin-top: 4px; }
    .bar { height: 4px; border-radius: 3px; background: #374151; overflow: hidden; margin: 8px 0; }
    .fill { height: 100%; background: #22c55e; }
    .actions { display: flex; gap: 5px; }
    .actions button { font-size: 10px; padding: 4px 7px; }
    .empty { color: #9ca3af; font-size: 12px; padding: 16px 2px; text-align: center; }
  </style>
</head>
<body>
  <header><h1>MediaDL Queue</h1><button id="refresh" type="button">Refresh</button></header>
  <div id="connection">Connecting to the local server…</div>
  <ol id="queue"></ol>
  <script src="sidepanel.js"></script>
</body>
</html>
